[package]
name = "fstest"
description = "Filesystem functional & benchmark test suites."
version = "0.1.0"
edition = "2024"

[lib]
name = "fstest"
path = "src/lib.rs"

[[bin]]
name = "fstest"
path = "src/main.rs"

[features]
default = ["embed-bundle"]
embed-bundle = []

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5"
env_logger = "0.11"
flate2 = "1.1"
hex = "0.4"
hostname = "0.4"
libc = "0.2"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
xattr = "1"

[build-dependencies]
flate2 = "1.1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
